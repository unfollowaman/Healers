<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Telegram Music Player</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- Top Corner Navigation Menu -->
    <div class="top-nav-container">
        <button class="hamburger-btn" id="hamburger-button" type="button" aria-expanded="false" aria-controls="nav-dropdown" aria-label="Toggle navigation menu">
            <svg class="hamburger-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12" class="line-middle"></line>
                <line x1="3" y1="6" x2="21" y2="6" class="line-top"></line>
                <line x1="3" y1="18" x2="21" y2="18" class="line-bottom"></line>
            </svg>
        </button>
        <div class="nav-dropdown hidden" id="nav-dropdown">
            <ul class="nav-menu-list">
                <li class="nav-menu-item" data-option="all-songs">
                    <button class="nav-menu-btn" type="button">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 18V5l12-2v13"></path>
                            <circle cx="6" cy="18" r="3"></circle>
                            <circle cx="18" cy="16" r="3"></circle>
                        </svg>
                        <span>All Songs</span>
                    </button>
                </li>
                <li class="nav-menu-item" data-option="playlists">
                    <button class="nav-menu-btn" type="button">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="8" y1="6" x2="21" y2="6"></line>
                            <line x1="8" y1="12" x2="21" y2="12"></line>
                            <line x1="8" y1="18" x2="21" y2="18"></line>
                            <polyline points="3 6 4 7 6 5"></polyline>
                            <polyline points="3 12 4 13 6 11"></polyline>
                            <polyline points="3 18 4 19 6 17"></polyline>
                        </svg>
                        <span>Playlists</span>
                    </button>
                </li>
                <li class="nav-menu-item" data-option="artists">
                    <button class="nav-menu-btn" type="button">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <span>Artists</span>
                    </button>
                </li>
                <li class="nav-menu-item" data-option="stats">
                    <button class="nav-menu-btn" type="button">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="20" x2="18" y2="10"></line>
                            <line x1="12" y1="20" x2="12" y2="4"></line>
                            <line x1="6" y1="20" x2="6" y2="14"></line>
                        </svg>
                        <span>Stats</span>
                    </button>
                </li>
            </ul>
        </div>
    </div>

    <!-- Fullscreen Video Background -->
    <video id="bg-video" autoplay loop muted playsinline class="bg-video">
        <source id="bg-video-source" src="/backgrounds/bg1.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <!-- Centered Pill Player -->
    <div class="player-container">
        <div class="player-wrapper">
            <div class="player-pill" id="player-pill">
                <audio id="audio-player" preload="metadata"></audio>

                <div class="album-art-container" id="album-art-container">
                    <div class="album-art-placeholder" id="album-art-placeholder"></div>
                </div>

                <div class="player-content">
                    <div class="track-info">
                        <span class="now-title" id="now-title">Loading...</span>
                        <span class="now-artist" id="now-artist">Please wait</span>
                    </div>

                    <div class="progress-row">
                        <input id="progress-bar" type="range" min="0" max="100" value="0" step="0.1" aria-label="Track progress">
                    </div>

                    <div class="time-row">
                        <span id="current-time">0:00</span>
                        <span id="total-time">0:00</span>
                    </div>
                </div>

                <div class="player-controls">
                    <button class="control-btn" id="prev-button" type="button" aria-label="Previous">
                        <img src="/assets/icons_legacy/prev.png" alt="Previous" width="18" height="18">
                    </button>
                    <button class="control-btn play-btn" id="play-button" type="button" aria-label="Play">
                        <img src="/assets/icons_legacy/play.png" alt="Play" id="play-icon-img" width="22" height="22">
                    </button>
                    <button class="control-btn" id="next-button" type="button" aria-label="Next">
                        <img src="/assets/icons_legacy/next.png" alt="Next" width="18" height="18">
                    </button>
                </div>
            </div>

            <!-- Attached "More" Section Tab -->
            <button class="player-more-tab" id="more-tab" type="button" aria-expanded="false" aria-controls="player-dropdown" aria-label="More options">
                <span class="more-label">More</span>
                <svg class="chevron-icon" id="more-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>

            <!-- Dropdown Menu -->
            <div class="player-dropdown hidden" id="player-dropdown">
                <div class="dropdown-controls">
                    <button class="dropdown-btn" id="shuffle-button" type="button" aria-label="Shuffle">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 3 21 3 21 8"></polyline>
                            <line x1="4" y1="20" x2="21" y2="3"></line>
                            <polyline points="21 16 21 21 16 21"></polyline>
                            <line x1="15" y1="15" x2="21" y2="21"></line>
                            <line x1="4" y1="4" x2="9" y2="9"></line>
                        </svg>
                        <span>Shuffle</span>
                    </button>

                    <button class="dropdown-btn" id="repeat-button" type="button" aria-label="Repeat">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="17 1 21 5 17 9"></polyline>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                            <polyline points="7 23 3 19 7 15"></polyline>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                        </svg>
                        <span id="repeat-label">Off</span>
                    </button>

                    <button class="dropdown-btn" id="queue-button" type="button" aria-label="Queue">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="8" y1="6" x2="21" y2="6"></line>
                            <line x1="8" y1="12" x2="21" y2="12"></line>
                            <line x1="8" y1="18" x2="21" y2="18"></line>
                            <line x1="3" y1="6" x2="3.01" y2="6"></line>
                            <line x1="3" y1="12" x2="3.01" y2="12"></line>
                            <line x1="3" y1="18" x2="3.01" y2="18"></line>
                        </svg>
                        <span>Queue</span>
                    </button>
                </div>

                <div class="dropdown-volume">
                    <button class="volume-btn" id="mute-button" type="button" aria-label="Mute / Unmute">
                        <svg id="volume-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        </svg>
                    </button>
                    <input id="volume-bar" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
                </div>

                <div class="queue-container hidden" id="queue-container">
                    <div class="queue-header">Queue</div>
                    <ul class="queue-list" id="queue-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js" defer></script>
</body>

</html>
