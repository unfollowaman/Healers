<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Telegram Music Player</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="app-layout">
        <header class="header">
            <button class="icon-button refresh-button" id="refresh-button" type="button" aria-label="Refresh songs">Refresh</button>
            <div class="search-container">
                <input id="search-input" type="search" autocomplete="off" placeholder="Search songs, artists...">
                <button class="icon-button search-icon-btn" id="search-toggle" type="button" aria-label="Toggle search">Search</button>
            </div>
        </header>

        <main class="library">
            <section class="status-card" id="status-card" hidden>
                <div class="loader" aria-hidden="true"></div>
                <p>Loading...</p>
            </section>

            <div class="content-wrapper" id="content-wrapper">
                <aside class="sidebar" id="sidebar">
                    <nav class="nav-list">
                        <div class="nav-item active" data-view="home">Home</div>
                        <div class="nav-item" data-view="all-songs">All Songs</div>
                        <div class="nav-item" data-view="artists">Artists</div>
                        <div class="nav-item" data-view="albums">Albums</div>
                        <div class="nav-item" data-view="playlists">Playlists</div>
                        <div class="nav-item" data-view="favorites">Favorites</div>
                        <div class="nav-item" data-view="recently-played">Recently Played</div>
                        <div class="nav-item" data-view="most-played">Most Played</div>
                    </nav>
                    <div class="playing-queue" id="playing-queue"></div>
                </aside>

                <div class="main-content">
                    <!-- Stats section -->
                    <div class="stats-card">
                        <span id="stat-songs">0</span>
                        <span id="stat-artists">0</span>
                        <span id="stat-albums">0</span>
                        <span id="stat-duration">0h 0m</span>
                        <span id="stat-songs-mobile">0</span>
                        <span id="stat-artists-mobile">0</span>
                        <span id="stat-albums-mobile">0</span>
                        <span id="stat-duration-mobile">0h 0m</span>
                    </div>

                    <!-- Actions -->
                    <button id="desktop-shuffle-all" type="button">Shuffle All (Desktop)</button>
                    <button id="mobile-shuffle-all" type="button">Shuffle All (Mobile)</button>
                    <button id="btn-recently-added" type="button">Recently Added</button>
                    <button id="btn-recently-added-mobile" type="button">Recently Added (Mobile)</button>

                    <!-- Sections -->
                    <section class="recently-added-section" id="recently-added-section">
                        <div class="recently-added-strip" id="recently-added-strip"></div>
                    </section>

                    <div id="mobile-artist-list"></div>
                    <div id="all-artists-list"></div>

                    <div id="mobile-home-queue-card"></div>

                    <div class="desktop-queue-section" id="desktop-queue-section">
                        <button id="desktop-clear-queue-btn" type="button">Clear Queue</button>
                        <div id="desktop-queue-table"></div>
                        <span id="queue-total-songs">0</span>
                        <span id="queue-total-duration">0:00</span>
                        <button id="desktop-save-queue-btn" type="button">Save as Playlist</button>
                    </div>

                    <section class="all-songs-section" id="all-songs-section">
                        <div class="section-header-row">
                            <h2 class="section-title">All Songs</h2>
                            <span id="all-songs-count">0</span>
                            <button id="sort-button" type="button">Sort</button>
                            <div class="playlist-dropdown" id="sort-dropdown" style="display: none;">
                                <div class="playlist-dropdown-item sort-dropdown-item" data-sort="oldest">Oldest to Newest</div>
                                <div class="playlist-dropdown-item sort-dropdown-item" data-sort="newest">Newly Added on Top</div>
                                <div class="playlist-dropdown-item sort-dropdown-item" data-sort="alphabetical">Alphabetical</div>
                            </div>
                            <span id="all-songs-count-text">0</span>
                            <span id="all-songs-duration-text">0h 0m</span>
                        </div>
                        <div class="column-headers"></div>
                        <div class="song-list" id="song-list"></div>
                    </section>

                    <!-- Mobile View Containers -->
                    <div id="mobile-view-home" class="mobile-view active-view"></div>
                    <div id="mobile-view-songs" class="mobile-view" style="display: none;"></div>
                    <div id="mobile-view-artists" class="mobile-view" style="display: none;"></div>
                    <div id="mobile-view-library" class="mobile-view" style="display: none;"></div>
                    <div id="mobile-view-more" class="mobile-view" style="display: none;"></div>
                </div>
            </div>
        </main>

        <!-- Player -->
        <footer class="player" id="player">
            <audio id="audio-player" preload="metadata"></audio>

            <div id="mobile-nowplaying-fullscreen">
                <div class="desktop-art-container" id="desktop-art-container">
                    <div class="desktop-art-placeholder" id="desktop-art-placeholder">
                        <div class="desktop-art-text-overlay">
                            <div class="line1" id="desktop-now-title"></div>
                            <div class="line2" id="desktop-now-artist"></div>
                        </div>
                    </div>
                    <canvas id="waveform-canvas-desktop"></canvas>
                </div>

                <div class="album-art-placeholder" id="album-art-placeholder"></div>
                <canvas id="waveform-canvas-mobile"></canvas>

                <div class="track-meta">
                    <strong id="now-title">Select a song</strong>
                    <span id="now-artist">Ready to play</span>
                </div>

                <input id="progress-bar" type="range" min="0" max="100" value="0" step="0.1">
                <span id="current-time">0:00</span>
                <span id="total-time">0:00</span>

                <div class="player-controls">
                    <button class="control-button shuffle-button" id="shuffle-button" type="button">Shuffle</button>
                    <button class="control-button prev-button" id="prev-button" type="button">Prev</button>
                    <button class="play-button" id="play-button" type="button">Play</button>
                    <button class="control-button next-button" id="next-button" type="button">Next</button>
                    <button class="control-button repeat-button" id="repeat-button" type="button">
                        Repeat
                        <span class="repeat-one-badge" style="display: none;">1</span>
                    </button>
                </div>

                <div class="volume-container">
                    <button class="icon-button volume-btn" id="mute-button" type="button">Mute</button>
                    <input id="volume-slider" type="range" min="0" max="100" value="85">
                    <button class="icon-button volume-btn" id="full-volume-button" type="button">Max</button>
                </div>

                <div id="mobile-queue-list"></div>
            </div>
        </footer>

        <div id="bottom-separator"></div>

        <div id="mobile-mini-player" style="display: none;">
            <strong id="mini-title">Select a song</strong>
            <span id="mini-artist">Ready to play</span>
            <button id="mini-prev-button" type="button">Prev</button>
            <button id="mini-play-button" type="button">Play</button>
            <button id="mini-next-button" type="button">Next</button>
            <div id="mini-progress-bar"></div>
        </div>

        <nav id="mobile-tab-bar">
            <button class="tab-btn tab-active" data-tab="home" type="button">Home</button>
            <button class="tab-btn" data-tab="songs" type="button">Songs</button>
            <button class="tab-btn" data-tab="artists" type="button">Artists</button>
            <button class="tab-btn" data-tab="library" type="button">Library</button>
            <button class="tab-btn" data-tab="more" type="button">More</button>
        </nav>
    </div>

    <script src="/js/app.js" defer></script>
</body>

</html>
