<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>Telegram Music Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Personal Telegram Library</p>
        <h1>Your music, streamed privately.</h1>
        <p class="hero-copy">Search and play the audio files stored in your Telegram channel without exposing your bot token.</p>
      </div>
      <button class="refresh-button" id="refresh-button" type="button" aria-label="Refresh songs from Telegram">Refresh</button>
    </header>

    <main class="library" aria-live="polite">
      <label class="search-card" for="search-input">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search-input" type="search" autocomplete="off" placeholder="Search songs or artists">
      </label>

      <section class="status-card" id="status-card">
        <div class="loader" aria-hidden="true"></div>
        <p>Loading songs from Telegram…</p>
      </section>

      <section class="song-list" id="song-list" aria-label="Song list"></section>
    </main>
  </div>

  <footer class="player-bar" aria-label="Audio player">
    <audio id="audio-player" preload="metadata"></audio>

    <div class="now-playing">
      <div class="album-art" aria-hidden="true">♪</div>
      <div class="track-meta">
        <strong id="now-title">Select a song</strong>
        <span id="now-artist">Ready to play</span>
      </div>
    </div>

    <div class="transport">
      <div class="transport-buttons">
        <button class="icon-button" id="prev-button" type="button" aria-label="Previous song">⏮</button>
        <button class="play-button" id="play-button" type="button" aria-label="Play or pause">▶</button>
        <button class="icon-button" id="next-button" type="button" aria-label="Next song">⏭</button>
      </div>
      <div class="progress-wrap">
        <span id="current-time">0:00</span>
        <input id="progress-bar" class="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Playback progress">
        <span id="total-time">0:00</span>
      </div>
    </div>

    <label class="volume-wrap" for="volume-slider">
      <span aria-hidden="true">🔊</span>
      <input id="volume-slider" type="range" min="0" max="1" value="0.85" step="0.01" aria-label="Volume">
    </label>
  </footer>

  <script src="/js/app.js" defer></script>
</body>
</html>
